        body {

        /* =========================
           КНОПКИ ПОД ЗАГОЛОВКОМ
           ========================= */

        .main-buttons {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 15px;

			margin: 20px 0 40px;
		}

        .main-button {
			display: flex;
			align-items: center;
			justify-content: center;

			width: 180px;
			height: 50px;

			padding: 0;

			background: rgba(45, 45, 45, 0.8);
			color: white;

			border: 1px solid rgba(255, 255, 255, 0.5);
			border-radius: 8px;

			text-decoration: none;
			font-size: 18px;

			cursor: pointer;

			transition:
				background 0.2s,
				transform 0.2s,
				border-color 0.2s;
		}

        .main-button:hover {
            background: rgba(70, 70, 70, 0.95);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .main-button:active {
            transform: translateY(0);
        }

        /* =========================
           РЕКЛАМА
           ========================= */

        .ad-zone {
            width: 728px;
            min-height: 90px;
            margin: 40px auto;
        }

        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
           ========================= */

        @media (max-width: 760px) {

            .main-buttons {
                gap: 8px;
                margin-left: 10px;
                margin-right: 10px;
            }

            .main-button {
                padding: 10px 20px;
                font-size: 15px;
            }

            .ad-zone {
                width: 100%;
                min-height: 90px;
                overflow: hidden;
            }

            h1 {
                font-size: 48px;
            }

            h2 {
                font-size: 26px;
            }
        }
    </style>
