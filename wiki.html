<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wiki</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
			margin: 0;
			min-height: 100vh;

			background: radial-gradient(
				ellipse 100% 70% at 50% 0%,
				#999999 0%,
				#858585 10%,
				#707070 20%,
				#595959 32%,
				#424242 45%,
				#2c2c2c 58%,
				#171717 72%,
				#070707 85%,
				#040404 90%,
				#000000 100%
			);

			background-attachment: fixed;

			color: white;
			font-family: Arial, sans-serif;
		}

        /* Шапка */
        .top-panel {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 64px;

            background: #2b2b2b;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            /* Линия снизу */
            border-bottom: 1px solid #666;

            z-index: 1000;
        }

        /* Кнопки */
        .panel-button {
            width: 44px;
            height: 44px;

            border: 1px solid #666;
            border-radius: 8px;

            background: #2b2b2b;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.2s;
        }

        .panel-button:hover {
            background: #3a3a3a;
            border-color: #888;
        }

        /* Меню — 3 линии */
        .menu-icon {
            width: 22px;
            height: 18px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-icon span {
            width: 22px;
            height: 2px;

            background: white;
            border-radius: 2px;
        }

        /* Лупа */
        .search-icon {
            position: relative;

            width: 18px;
            height: 18px;

            border: 2px solid white;
            border-radius: 50%;
        }

        .search-icon::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 2px;

            background: white;
            border-radius: 2px;

            right: -6px;
            bottom: -3px;

            transform: rotate(45deg);
        }

        /* Контент */
        .content {
            max-width: 800px;
            margin: 0 auto;

            padding: 120px 30px 30px;

            text-align: center;
        }

        h1 {
            font-size: 56px;
            margin: 20px 0;
        }

        h2 {
            font-size: 28px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="top-panel">

        <!-- Меню -->
        <button class="panel-button" onclick="openMenu()">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>

        <!-- Поиск -->
        <button class="panel-button" onclick="openSearch()">
            <div class="search-icon"></div>
        </button>

    </div>

    <div class="content">

        <h1>Донат</h1>

        <h2>Поддержать сервер</h2>

        <p>
            Здесь будут находиться донат-привилегии.
        </p>

    </div>

    <script>
        function openMenu() {
            alert("Меню");
        }

        function openSearch() {
            alert("Поиск");
        }
    </script>

</body>
</html>
